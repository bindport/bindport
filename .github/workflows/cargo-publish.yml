name: Cargo Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to publish, for example 0.1.0 or v0.1.0
        required: true
        type: string
      execute:
        description: Publish to crates.io after the dry-run succeeds
        required: true
        default: false
        type: boolean

concurrency:
  group: cargo-publish-${{ inputs.version }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dry-run:
    name: cargo publish dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          sha256: 2950f8e1c59f3d9716bc3ee7d9242de94f9ab4054d97e65e12f2e67867c5f8fd
          install: true
          install_args: --locked --jobs=1
          cache: true

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Dry-run Cargo publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: scripts/cargo-publish.sh --version "$RELEASE_VERSION" --dry-run

      - name: Verify dry-run did not change source
        run: git diff --exit-code

  publish:
    name: cargo publish
    if: ${{ inputs.execute }}
    needs: dry-run
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          sha256: 2950f8e1c59f3d9716bc3ee7d9242de94f9ab4054d97e65e12f2e67867c5f8fd
          install: true
          install_args: --locked --jobs=1
          cache: true

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Publish Cargo packages
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: scripts/cargo-publish.sh --version "$RELEASE_VERSION" --execute --yes
