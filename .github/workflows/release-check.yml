name: Release Check

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to validate, for example 0.1.0 or v0.1.0
        required: true
        type: string
      npm_package_name:
        description: Expected npm package name
        required: true
        default: bindport
        type: string
      run_ci:
        description: Run the full local CI gate before package dry-runs
        required: true
        default: true
        type: boolean
      publish_ready:
        description: Dry-run crates whose workspace dependencies are on crates.io
        required: true
        default: false
        type: boolean

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-check:
    name: manual release check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.2
          sha256: 2950f8e1c59f3d9716bc3ee7d9242de94f9ab4054d97e65e12f2e67867c5f8fd
          install: true
          install_args: --locked --jobs=1
          cache: true

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Run release check
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_PACKAGE_NAME: ${{ inputs.npm_package_name }}
          RUN_CI: ${{ inputs.run_ci }}
          PUBLISH_READY: ${{ inputs.publish_ready }}
        run: scripts/release-check.sh

      - name: Verify release check did not change source
        run: git diff --exit-code
