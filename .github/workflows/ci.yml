name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: linux ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          version: 2026.8.6
          sha256: 96f6f1f416d868b78addd22746eefc7f4bf7820c6a3afa392a9f653f708c1644
          install: true
          install_args: --locked --jobs=4 rust node github:rust-lang/mdBook actionlint gitleaks trivy shellcheck
          cache: true

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Cargo-based CI tools
        run: |
          set -euo pipefail

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          curl -fsSLo "$tmp/cargo-audit.tgz" https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2.tgz
          echo "ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39  $tmp/cargo-audit.tgz" | sha256sum -c -
          tar -xzf "$tmp/cargo-audit.tgz" -C "$tmp"
          install -m 0755 "$tmp/cargo-audit-x86_64-unknown-linux-gnu-v0.22.2/cargo-audit" "$HOME/.cargo/bin/cargo-audit"

          curl -fsSLo "$tmp/cargo-llvm-cov.tar.gz" https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.8.7/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz
          echo "9a75fe29538d3800b3da57f6f6efb64cba5c720a257bf0cb8b51f39d495a9168  $tmp/cargo-llvm-cov.tar.gz" | sha256sum -c -
          tar -xzf "$tmp/cargo-llvm-cov.tar.gz" -C "$tmp"
          install -m 0755 "$tmp/cargo-llvm-cov" "$HOME/.cargo/bin/cargo-llvm-cov"

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Check platform cfg guards
        run: cargo run -p xtask -- platform-guard

      - name: Lint workflows
        run: actionlint

      - name: Audit Rust dependencies
        if: ${{ !cancelled() }}
        run: cargo audit

      - name: Check dependency substitutions
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail

          for package in zmij yaml_serde libyaml-rs; do
            if cargo tree --locked -p "$package" >/dev/null 2>&1; then
              echo "banned dependency present: $package" >&2
              exit 1
            fi
          done

          for package in ryu serde_yaml_ng unsafe-libyaml; do
            if ! cargo tree --locked -p "$package" >/dev/null 2>&1; then
              echo "required dependency missing: $package" >&2
              exit 1
            fi
          done

      - name: Scan for leaked secrets
        if: ${{ !cancelled() }}
        run: gitleaks detect --source . --redact --no-banner

      - name: Scan filesystem security posture
        if: ${{ !cancelled() }}
        run: trivy fs --scanners vuln,misconfig --severity HIGH,CRITICAL --exit-code 1 --skip-dirs target --skip-dirs .git --no-progress .

      - name: Test release tooling
        run: cargo test -p xtask --locked

      - name: Coverage
        run: cargo llvm-cov --workspace --exclude xtask --all-targets --summary-only --fail-under-lines 90 --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Check wrapper startup regression ceiling
        run: target/release/xtask startup-budget --ci

      - name: Smoke test staged release artifacts
        run: target/release/xtask release-smoke --binary target/release/bindport

      - name: Build docs site
        run: scripts/docs-build.sh

  macos:
    name: macos compatibility
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy
          rustup default 1.97.1

      - name: Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Build release binary
        run: cargo build --release --locked

      - name: Check wrapper startup regression ceiling
        run: target/release/xtask startup-budget --ci

      - name: Smoke test staged release artifacts
        run: target/release/xtask release-smoke --binary target/release/bindport
